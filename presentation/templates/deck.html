<!doctype html>
<!--
  СКЕЛЕТ автономной HTML-презентации для скилла `presentation` (готовых слайдов НЕТ —
  собираешь их сам по плану; см. инструкцию внутри <deck-stage> ниже).
  КАК ПОЛЬЗОВАТЬСЯ (для агента):
    1. Скопируй этот файл как presentation/<тема>.html
    2. Стиль по умолчанию — Сбер (белый/зелёный). :root НЕ трогай, если пользователь
       не назвал другой бренд (другие пресеты — references/layout-system.md §6).
    3. Собери слайды внутри <deck-stage> — РОВНО столько, сколько просил пользователь,
       вместив ВСЮ информацию (не обрезая). Форму каждого слайда выбирай под содержание,
       варьируй; первый слайд — тоже по содержанию. Правила и анатомия — в комментарии
       внутри <deck-stage>. Готовые блоки форм — references/layout-system.md §4.
    4. Полную шпаргалку (формы, рамка, бюджет высоты) см. references/layout-system.md
    5. НИЧЕГО не трогай ниже маркера ENGINE (внизу файла) — это движок слайдов.
  Файл самодостаточен: движок встроен, внешняя зависимость только одна — веб-шрифт.
  Открывается двойным кликом, листается ← → Space, печатается в PDF.
-->
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Презентация</title>

<!-- Golos Text — мягкий гротеск с полной кириллицей, ближайший бесплатный аналог
     фирменного SB Sans Сбера. IBM Plex Mono — для моно-подписей (кикеры, рамка). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
  /* ── ТОКЕНЫ ДИЗАЙНА — по умолчанию ФИРМЕННЫЙ СТИЛЬ СБЕРА (белый + зелёный) ─────
     НЕ меняй цвета, если пользователь не назвал ДРУГОЙ бренд. Новые цвета не вводи. */
  :root{
    --bg:#FFFFFF;          /* основной фон — белый */
    --bg-invert:#0A2017;   /* глубокий зелёный для 1–2 акцентных слайдов */
    --ink:#0F1B14;         /* основной текст */
    --ink-invert:#FFFFFF;  /* текст на тёмном */
    --muted:#5E6B62;       /* вторичный текст */
    --muted-d:#9FB5A8;     /* вторичный на тёмном */
    --line:#E6EBE7;        /* тонкая линия */
    --line-d:#1E3D2B;      /* линия на тёмном */
    --accent:#21A038;      /* фирменный зелёный Сбера — единственный акцент */
    --accent-l:#3FCB6E;    /* светлее — для тёмных слайдов */
    --card:#F4F8F5;
    --font-display:"Golos Text", system-ui, sans-serif;
    --font-body:"Golos Text", system-ui, sans-serif;
    --font-mono:"IBM Plex Mono", ui-monospace, monospace;
    --x:120px;             /* боковое поле */
  }
  *{ box-sizing:border-box; }

  /* ── БАЗА СЛАЙДА ─── канва 1920×1080, поля под фирменную рамку ───────────── */
  deck-stage section{
    position:relative;
    padding:132px var(--x) 118px;     /* сверху/снизу — место под рамку; полезная область 1680×830 */
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-hyphens:manual; hyphens:manual;
  }
  section.invert{ background:var(--bg-invert); color:var(--ink-invert); }

  /* ── СКВОЗНАЯ ФИРМЕННАЯ РАМКА (на каждом слайде) ────────────────────────── */
  .fr{ position:absolute; inset:0; pointer-events:none; z-index:2; }
  .fr-top{ position:absolute; top:58px; left:var(--x); right:var(--x); display:flex; justify-content:space-between; align-items:center;
    font:600 17px/1 var(--font-mono); letter-spacing:.14em; text-transform:uppercase; }
  .wm{ display:flex; align-items:center; gap:11px; color:var(--ink); }
  .wm .dot{ width:16px; height:16px; border-radius:50%; background:conic-gradient(from -40deg,#21A038,#54D06A,#21B8B0,#FFD24D,#21A038); }
  .fr-top .sec{ color:var(--muted); }
  .fr-bot{ position:absolute; bottom:54px; left:var(--x); right:var(--x); display:flex; justify-content:space-between; align-items:center;
    border-top:1px solid var(--line); padding-top:20px;
    font:600 15px/1 var(--font-mono); letter-spacing:.1em; color:var(--muted); }
  section.invert .wm{ color:var(--ink-invert); }
  section.invert .fr-top .sec{ color:var(--muted-d); }
  section.invert .fr-bot{ border-color:var(--line-d); color:var(--muted-d); }

  /* фирменный круг-мотив (декор; data-decorative — аудит его игнорирует) */
  .ring{ position:absolute; border-radius:50%; border:1.5px solid color-mix(in srgb, var(--accent-l) 40%, transparent); z-index:0; }
  .disc{ position:absolute; border-radius:50%; background:color-mix(in srgb, var(--accent-l) 8%, transparent); z-index:0; }

  /* Sber-штрихи: скругления (фирменная черта Сбера) */
  .card, .bar-track, .ph{ border-radius:16px; }
  .bar-track{ overflow:hidden; }

  /* ── ОБЩИЕ ЭЛЕМЕНТЫ ───────────────────────────────────────────────────── */
  .kicker{ font:600 19px/1 var(--font-mono); letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin:0 0 18px; }
  section.invert .kicker{ color:var(--accent-l); }
  .title{ font:600 58px/1.1 var(--font-display); letter-spacing:-.01em; margin:0; max-width:26ch; text-wrap:balance; }
  .ph{ display:flex; align-items:center; justify-content:center; height:100%; border:1px dashed var(--line); color:var(--muted);
    font:500 20px/1.3 var(--font-mono); letter-spacing:.04em; text-align:center; padding:24px; }

  /* ── РАСКЛАДКИ (полезная область 1680×830; шапка ~240 → ~590 под контент) ── */

  /* Обложка / финал */
  .layout-cover{ display:grid; align-content:end; gap:28px; position:relative; z-index:1; }
  .layout-cover h1{ font:500 110px/1.02 var(--font-display); letter-spacing:-.02em; margin:0; max-width:19ch; text-wrap:balance; }
  .layout-cover .sub{ font:400 32px/1.4 var(--font-body); max-width:38ch; color:var(--muted); margin:0; }
  section.invert .layout-cover .sub{ color:var(--muted-d); }

  /* Тезис: вертикальная акцентная линия + крупный текст */
  .layout-statement{ display:grid; grid-template-columns:5px 1fr; gap:54px; align-content:center; align-items:center; position:relative; z-index:1; }
  .layout-statement .bar{ background:var(--accent); align-self:stretch; }
  .layout-statement .lead{ font:500 80px/1.1 var(--font-display); letter-spacing:-.02em; margin:0; max-width:26ch; text-wrap:balance; }

  /* Редакционные колонки (предпочтительно для «3 аспекта»). Контент распределён по высоте
     (индекс сверху, текст снизу) — колонка заполняет кадр, без пустот. */
  .layout-cols{ display:grid; grid-template-rows:auto 1fr; gap:40px; }
  .cols{ display:grid; grid-template-columns:repeat(3,1fr); height:100%; border-top:1.5px solid var(--ink); }
  .cols.two{ grid-template-columns:repeat(2,1fr); }
  .col{ display:flex; flex-direction:column; justify-content:flex-start; gap:22px; padding:40px 46px 0; border-left:1px solid var(--line); }
  .col:first-child{ border-left:none; padding-left:0; }
  .col:last-child{ padding-right:0; }
  .col .idx{ font:500 46px/1 var(--font-display); color:var(--accent); letter-spacing:-.01em; }
  .col .ct{ display:flex; flex-direction:column; gap:14px; }
  .col h3{ font:600 34px/1.18 var(--font-body); margin:0; }
  .col p{ font:400 24px/1.55 var(--muted); margin:0; max-width:25ch; }
  section.invert .cols{ border-color:var(--ink-invert); }
  section.invert .col{ border-color:var(--line-d); }
  section.invert .col .idx{ color:var(--accent-l); }
  section.invert .col p{ color:var(--muted-d); }

  /* Крупные цифры (верхняя линия на всю ширину + колонки). Числа крупные — заполняют кадр. */
  .layout-stats{ display:grid; grid-template-rows:auto 1fr; gap:40px; }
  .stats{ display:grid; grid-template-columns:repeat(3,1fr); height:100%; border-top:1.5px solid var(--ink); padding-top:48px; }
  section.invert .stats{ border-color:var(--ink-invert); }
  .stat{ padding-left:44px; border-left:1px solid var(--line); }
  .stat:first-child{ border-left:none; padding-left:0; }
  section.invert .stat{ border-color:var(--line-d); }
  .stat .num{ font:500 116px/1 var(--font-display); color:var(--accent); letter-spacing:-.03em; }
  section.invert .stat .num{ color:var(--accent-l); }
  .stat .lab{ font:400 24px/1.45 var(--muted); margin-top:20px; max-width:18ch; }
  section.invert .stat .lab{ color:var(--muted-d); }

  /* График — горизонтальные бары (для показа реальных/посчитанных чисел). Ширину .bar-fill
     задавай инлайн style="width:NN%" = доля от максимума. Заполняет кадр по ширине и высоте. */
  .layout-chart{ display:grid; grid-template-rows:auto 1fr; gap:44px; }
  .chart{ display:flex; flex-direction:column; justify-content:space-between; padding:10px 0; }
  .bar-row{ display:grid; grid-template-columns:300px 1fr 150px; align-items:center; gap:28px; }
  .bar-row .blab{ font:500 26px/1.25 var(--font-body); }
  .bar-track{ height:46px; background:var(--line); }
  .bar-fill{ height:100%; background:var(--accent); }
  .bar-row .bval{ font:600 34px/1 var(--font-display); color:var(--accent); text-align:right; letter-spacing:-.01em; }
  section.invert .bar-row .blab{ color:var(--ink-invert); }
  section.invert .bar-track{ background:var(--line-d); }
  section.invert .bar-fill{ background:var(--accent-l); }
  section.invert .bar-row .bval{ color:var(--accent-l); }

  /* Карточки (альтернатива колонкам) */
  .layout-cards{ display:grid; grid-template-rows:auto 1fr; gap:48px; }
  .cards{ display:grid; grid-template-columns:repeat(3,1fr); gap:28px; align-content:center; }
  .cards.two{ grid-template-columns:repeat(2,1fr); }
  .card{ display:flex; flex-direction:column; gap:14px; padding:40px; background:var(--card); border:1px solid var(--line); min-height:230px; }
  .card h3{ font:600 30px/1.15 var(--font-body); margin:0; }
  .card p{ font:400 23px/1.4 var(--muted); margin:0; }
  section.invert .card{ background:#0F2B1C; border-color:var(--line-d); }
  section.invert .card p{ color:var(--muted-d); }

  /* Текст + визуал (две колонки) */
  .layout-split{ display:grid; grid-template-columns:1fr 1fr; gap:88px; align-items:center; }
  .layout-split .body{ font:400 32px/1.45 var(--font-body); color:var(--muted); margin:20px 0 0; max-width:30ch; }
  section.invert .layout-split .body{ color:var(--muted-d); }

  /* Нумерованный список шагов */
  .layout-list{ display:grid; grid-template-rows:auto 1fr; gap:44px; }
  .list{ display:flex; flex-direction:column; justify-content:center; gap:30px; margin:0; padding:0; }
  .list li{ display:grid; grid-template-columns:72px 1fr; gap:24px; align-items:baseline; list-style:none; }
  .list .n{ font:500 44px/1 var(--font-display); color:var(--accent); }
  .list .t{ font:400 30px/1.4 var(--ink); }
  section.invert .list .n{ color:var(--accent-l); }
  section.invert .list .t{ color:var(--ink-invert); }

  /* Цитата */
  .layout-quote{ display:grid; align-content:center; gap:40px; position:relative; z-index:1; }
  .layout-quote blockquote{ font:400 56px/1.22 var(--font-display); margin:0; max-width:26ch; text-wrap:balance; }
  .layout-quote .by{ font:600 22px/1 var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  section.invert .layout-quote .by{ color:var(--muted-d); }

  /* Сравнение «было / стало» */
  .layout-compare{ display:grid; grid-template-rows:auto 1fr; gap:48px; }
  .compare{ display:grid; grid-template-columns:1fr 1fr; gap:28px; align-content:center; }
  .compare .col2{ display:flex; flex-direction:column; gap:18px; padding:40px; border:1px solid var(--line); }
  .compare .col2.win{ border-color:var(--accent); }
  .compare h3{ font:600 28px/1.15 var(--font-body); margin:0; }
  .compare ul{ margin:0; padding-left:1.1em; } .compare li{ font:400 24px/1.5 var(--muted); margin:.25em 0; }

  .stretch{ height:100%; width:100%; }
</style>
</head>
<body>

<deck-stage width="1920" height="1080">
  <!--
    === СОБИРАЙ СЛАЙДЫ ЗДЕСЬ — ПО ПЛАНУ presentation/<тема>.plan.md ===
    ЭТО СКЕЛЕТ, А НЕ ГОТОВАЯ ДЕКА. Примеров-слайдов тут НЕТ намеренно: чтобы ты
    не «заполнял шаблон по одному образцу», а ПРОЕКТИРОВАЛ каждый слайд заново
    под его содержание. Именно отсюда раньше росла однотипность.

    ПРАВИЛА:
    1) РОВНО столько слайдов, сколько просил пользователь. Распредели ВСЮ
       информацию по этому числу: приоритизируй, объединяй, уплотняй. НЕ создавай
       лишние слайды и НЕ обрезай контент. Не вмещается даже после уплотнения —
       СПРОСИ пользователя (увеличить число или что убрать), не режь молча.
    2) Форму КАЖДОГО слайда выбирай ПОД ЕГО СОДЕРЖАНИЕ из словаря форм
       (references/layout-system.md §4): число → stats / chart; сравнение → compare;
       перечень аспектов → cols; одна мысль → statement; цитата → quote; и т.д.
       ВАРЬИРУЙ формы — не повторяй одну подряд. Первый слайд — ТОЖЕ по содержанию,
       а НЕ автоматически обложка .layout-cover.
    3) Каждый <section> = один слайд и несёт: класс-форму + блок рамки .fr.
       Числа — ТОЛЬКО из «Реестра данных» плана. Крупный текст помечай data-fit.
       Номер слайда .pg движок проставит сам — оставляй <span class="pg"></span> пустым.

    АНАТОМИЯ ОДНОГО СЛАЙДА (скопируй, замени layout-XXX на нужную форму, наполни
    готовым блоком из layout-system.md §4):
    <section class="layout-XXX">
      <div class="fr" data-decorative>
        <div class="fr-top"><span class="wm"><span class="dot"></span>Сбер</span><span class="sec">Раздел</span></div>
        <div class="fr-bot"><span>Подпись слева</span><span class="pg"></span></div>
      </div>
      ... контент слайда по выбранной форме ...
    </section>
  -->

</deck-stage>

<!-- Заметки докладчика (опционально): по строке на слайд, в том же порядке.
<script id="speaker-notes" type="application/json">["Заметка 1", "Заметка 2"]</script>
-->

<!-- ENGINE ─── НИЖЕ НИЧЕГО НЕ МЕНЯЙ ─── движок <deck-stage> (vanilla JS, без зависимостей) ── -->
<script>
(() => {
  if (customElements.get('deck-stage')) return;
  const printStyle = document.createElement('style');
  printStyle.id = 'deck-stage-print';
  printStyle.textContent = `
    @media print {
      @page { size: 1920px 1080px; margin: 0; }
      body { margin: 0; }
      deck-stage { display: block; background: white; }
      deck-stage section { page-break-after: always; break-after: page; }
      deck-stage section:last-child { page-break-after: auto; }
    }`;
  document.head.appendChild(printStyle);

  class DeckStage extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: 'open' });
      this._current = 0; this._sections = []; this._resizeRaf = 0;
      this._storageKey = `deck_cur_slide_${location.pathname}`;
    }
    connectedCallback() {
      const w = parseInt(this.getAttribute('width'), 10) || 1920;
      const h = parseInt(this.getAttribute('height'), 10) || 1080;
      this._w = w; this._h = h;
      this.shadowRoot.innerHTML = `
        <style>
          :host { display:block; width:100vw; height:100vh; background:#000; overflow:hidden; position:relative; }
          :host([noscale]) { width:${w}px; height:${h}px; background:transparent; }
          :host([noscale]) .deck-canvas { transform:none !important; }
          .deck-canvas { position:absolute; left:50%; top:50%; width:${w}px; height:${h}px; transform-origin:0 0; background:white; }
          ::slotted(section) { width:${w}px; height:${h}px; box-sizing:border-box; overflow:hidden; }
          ::slotted(section:not(.active)) { display:none !important; }
          .deck-nav-hit { position:fixed; top:0; bottom:0; width:15%; cursor:pointer; z-index:50; }
          .deck-nav-hit.prev { left:0; } .deck-nav-hit.next { right:0; }
          @media (hover: hover) { .deck-nav-hit { display:none; } }
        </style>
        <div class="deck-canvas"><slot></slot></div>
        <div class="deck-nav-hit prev" data-dir="-1"></div>
        <div class="deck-nav-hit next" data-dir="+1"></div>`;
      this._canvas = this.shadowRoot.querySelector('.deck-canvas');
      this._collectSections(); this._tagSections(); this._applyScale();
      this._restorePosition(); this._renderPager(); this._showCurrent();
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this._fitText());
      this._onKey = this._onKey.bind(this); this._onResize = this._onResize.bind(this); this._onTap = this._onTap.bind(this);
      document.addEventListener('keydown', this._onKey);
      window.addEventListener('resize', this._onResize);
      this.shadowRoot.querySelectorAll('.deck-nav-hit').forEach(el => el.addEventListener('click', this._onTap));
      this._slotObserver = new MutationObserver(() => {
        this._collectSections(); this._tagSections(); this._clampCurrent(); this._renderPager(); this._showCurrent();
      });
      this._slotObserver.observe(this, { childList: true });
      this._onMessage = (e) => { if (e.data && typeof e.data === 'object' && typeof e.data.seekSlide === 'number') this.goToSlide(e.data.seekSlide); };
      window.addEventListener('message', this._onMessage);
    }
    disconnectedCallback() {
      document.removeEventListener('keydown', this._onKey);
      window.removeEventListener('resize', this._onResize);
      window.removeEventListener('message', this._onMessage);
      this._slotObserver?.disconnect();
    }
    static get observedAttributes() { return ['noscale']; }
    attributeChangedCallback(name) { if (name === 'noscale') this._applyScale(); }
    get totalSlides() { return this._sections.length; }
    get currentSlide() { return this._current; }
    goToSlide(idx) {
      if (!this._sections.length) return;
      idx = Math.max(0, Math.min(this._sections.length - 1, idx | 0));
      this._current = idx; this._showCurrent(); this._persistPosition(); this._postSlideChanged();
    }
    _clampCurrent() { this._current = this._sections.length ? Math.max(0, Math.min(this._sections.length - 1, this._current)) : 0; }
    nextSlide() { this.goToSlide(this._current + 1); }
    prevSlide() { this.goToSlide(this._current - 1); }
    _collectSections() { this._sections = Array.from(this.children).filter(c => c.tagName === 'SECTION'); }
    _tagSections() {
      this._sections.forEach((s, i) => {
        const idx = String(i + 1).padStart(2, '0');
        if (!s.getAttribute('data-screen-label')) {
          const heading = s.querySelector('h1, h2, [data-title]');
          const title = heading ? heading.textContent.trim().slice(0, 30) : `Slide ${i + 1}`;
          s.setAttribute('data-screen-label', `${idx} ${title}`);
        }
      });
    }
    _renderPager() {
      // Авто-нумерация в фирменной рамке: заполняем .pg каждого слайда «NN / TT».
      const tt = String(this._sections.length).padStart(2, '0');
      this._sections.forEach((s, i) => {
        const pg = s.querySelector('.pg');
        if (pg) pg.textContent = `${String(i + 1).padStart(2, '0')} / ${tt}`;
      });
    }
    _showCurrent() { this._sections.forEach((s, i) => s.classList.toggle('active', i === this._current)); this._fitText(); }
    _fitText() {
      const s = this._sections[this._current];
      if (!s) return;
      requestAnimationFrame(() => {
        s.querySelectorAll('[data-fit]').forEach(el => {
          const cs = getComputedStyle(el);
          const max = parseFloat(el.dataset.fitMax) || parseFloat(cs.fontSize);
          const min = parseFloat(el.dataset.fitMin) || Math.max(24, max * 0.55);
          el.style.fontSize = max + 'px';
          const fits = () => el.scrollWidth <= el.clientWidth + 1 && el.scrollHeight <= el.clientHeight + 1;
          let size = max, guard = 0;
          while (guard++ < 28 && size > min && !fits()) {
            size = Math.max(min, size - Math.max(1, size * 0.04));
            el.style.fontSize = size + 'px';
          }
        });
      });
    }
    _applyScale() {
      if (this.hasAttribute('noscale')) { this._canvas.style.transform = 'none'; this._canvas.style.left = '0'; this._canvas.style.top = '0'; return; }
      cancelAnimationFrame(this._resizeRaf);
      this._resizeRaf = requestAnimationFrame(() => {
        const vw = window.innerWidth, vh = window.innerHeight;
        const scale = Math.min(vw / this._w, vh / this._h);
        const tx = (vw - this._w * scale) / 2, ty = (vh - this._h * scale) / 2;
        this._canvas.style.left = '0'; this._canvas.style.top = '0';
        this._canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      });
    }
    _onResize() { this._applyScale(); }
    _onKey(e) {
      if (e.defaultPrevented) return;
      const tag = (e.target && e.target.tagName || '').toLowerCase();
      if (['input', 'textarea', 'select'].includes(tag)) return;
      switch (e.key) {
        case 'ArrowRight': case 'PageDown': case ' ': this.nextSlide(); e.preventDefault(); break;
        case 'ArrowLeft': case 'PageUp': this.prevSlide(); e.preventDefault(); break;
        case 'Home': this.goToSlide(0); e.preventDefault(); break;
        case 'End': this.goToSlide(this._sections.length - 1); e.preventDefault(); break;
      }
    }
    _onTap(e) { const dir = e.currentTarget.dataset.dir; if (dir === '+1') this.nextSlide(); else if (dir === '-1') this.prevSlide(); }
    _persistPosition() { try { localStorage.setItem(this._storageKey, String(this._current)); } catch {} }
    _restorePosition() { try { const v = parseInt(localStorage.getItem(this._storageKey), 10); if (!Number.isNaN(v)) this._current = Math.max(0, Math.min(this._sections.length - 1, v)); } catch {} }
    _postSlideChanged() {
      const note = this._getSpeakerNote(this._current);
      const payload = { slideIndexChanged: this._current };
      if (note) payload.note = note;
      try { window.postMessage(payload, '*'); } catch {}
    }
    _getSpeakerNote(idx) {
      const el = document.getElementById('speaker-notes'); if (!el) return null;
      try { const arr = JSON.parse(el.textContent); return Array.isArray(arr) ? (arr[idx] || null) : null; } catch { return null; }
    }
  }
  customElements.define('deck-stage', DeckStage);
})();
</script>
